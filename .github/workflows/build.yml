name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        postgres-version: [17]
        include:
          - os: windows-2025
            postgres-version: 17
    steps:
      - uses: actions/checkout@v4
      - uses: ./.
        with:
          postgres-version: ${{ matrix.postgres-version }}
          config: |
            shared_preload_libraries = 'pg_stat_statements'
          database: testdb
          user: testuser
          dev-files: ${{ matrix.postgres-version == 13 }}
      - run: createdb -U testuser testdb2
      - run: psql -U testuser -d testdb -c 'SHOW server_version'
      - run: psql -U testuser -d testdb -h localhost -c 'SHOW server_version'
      - run: psql --version
      - run: pg_config
      - if: ${{ matrix.postgres-version == 13 }}
        run: test -f $(pg_config --includedir-server)/postgres.h
